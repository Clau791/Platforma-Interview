services:
  db:
    image: postgres:15
    container_name: aic_postgres
    environment:
      POSTGRES_DB: aic_db
      POSTGRES_USER: aic_user
      POSTGRES_PASSWORD: aic_password
    ports:
      - "5432:5432"
    volumes:
      - aic_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    container_name: aic_backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://aic_user:aic_password@db:5432/aic_db
      CORS_ORIGINS: http://localhost:5173
      UVICORN_RELOAD: "1"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ../backend:/app
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ../frontend
    container_name: aic_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules

  sandbox:
    build:
      context: ./sandbox
    image: aic_sandbox_runner
    container_name: aic_sandbox
    command: ["sleep", "infinity"]

volumes:
  aic_db_data:
